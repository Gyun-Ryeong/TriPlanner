spring:
  application:
    name: backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# 관리자 로그인 아이디 (로그인 화면의 이메일 칸에 입력하는 값). 여러 명이면 쉼표로 구분
admin:
  emails: ${ADMIN_EMAILS:test}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-application-local.yml}
  expiration-ms: 86400000

naver:
  login:
    redirect-uri: ${NAVER_LOGIN_REDIRECT_URI:http://localhost:8080/api/auth/naver/callback}
    frontend-redirect-base: ${FRONTEND_REDIRECT_BASE:http://localhost:5173}

# AI 여행 챗봇: rag_project 의 FastAPI 서버 (python -m uvicorn api_server:app --port 8000)
rag:
  base-url: ${RAG_BASE_URL:http://localhost:8000}
  # 일정 생성은 로컬 LLM 응답(기본 최대 300초) + 데이터 수집 시간이 걸려 넉넉하게 잡는다
  read-timeout-seconds: ${RAG_READ_TIMEOUT_SECONDS:360}