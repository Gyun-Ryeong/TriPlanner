# 배포(AWS) 설정. 실행할 때 SPRING_PROFILES_ACTIVE=prod 로 켠다.
# 비밀 값은 여기에 쓰지 않고 서버의 환경변수(deploy/.env)에서 읽는다. 이 파일은 깃에 올라가도 안전하다.
spring:
  datasource:
    # 예: jdbc:mysql://(RDS 엔드포인트):3306/triplanner?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5      # t3.small + RDS 프리티어라 연결 수를 작게
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}

naver:
  login:
    client-id: ${NAVER_LOGIN_CLIENT_ID:}
    client-secret: ${NAVER_LOGIN_CLIENT_SECRET:}
  app:
    client-id: ${NAVER_APP_CLIENT_ID}
    client-secret: ${NAVER_APP_CLIENT_SECRET}
  map:
    client-id: ${NAVER_MAP_CLIENT_ID}
    client-secret: ${NAVER_MAP_CLIENT_SECRET}

public-data:
  service-key: ${PUBLIC_DATA_SERVICE_KEY}

tmap:
  app-key: ${TMAP_APP_KEY}

# 화면 주소 (쉼표로 여러 개). Nginx가 화면과 /api 를 같은 주소로 주면 보통 필요 없지만, 다른 주소에서 띄울 때 허용
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}

logging:
  level:
    root: INFO
