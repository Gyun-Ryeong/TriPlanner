# 하나의 주소(80번)로 화면과 API를 함께 준다.
#   /      → React 빌드 결과 (새로고침해도 화면 주소가 깨지지 않게 index.html 로 넘김)
#   /api/  → 백엔드(backend:8080)
server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 같은 서버를 거쳐 온 요청이라 Origin 을 떼고 보낸다 (개발용 Vite 프록시와 같은 동작, CORS 거절 방지)
        proxy_set_header Origin "";
        # AI 일정 생성은 1~3분 걸릴 수 있다 (백엔드의 RAG 대기 시간 15분에 맞춤)
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드된 js·css 는 파일 이름이 바뀌므로 오래 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
